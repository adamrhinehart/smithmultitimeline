<body>
<div id="app">

  <header class="top">
    <h1>Joseph Smith MultiTimeline</h1>
    <div class="subtitle">A Research Board for the Life of Joseph Smith</div>
    <div class="header-spacer"></div>
    <button id="focusToggleBtn" class="focus-toggle-btn" title="Open your Focus workspace — pin entries to build your own thread or theory"><span class="fi-hand">&#9758;</span><span>Focus</span></button>
  </header>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="Search titles, notes, people…">
    <select id="personFilter"><option value="">All people</option></select>
    <select id="themeFilter"><option value="">All themes</option></select>
    <label class="small">Zoom
      <input type="range" id="zoomSlider" min="0" max="1000" value="0" list="zoomStops">
      <datalist id="zoomStops"></datalist>
    </label>
    <span class="zoom-level-label" id="zoomLevelLabel"></span>
    <label class="small" style="gap:5px;">Go to
      <input type="number" id="jumpYear" class="jump-field" placeholder="Y" min="1700" max="1900">
      <select id="jumpMonth" class="jump-field"><option value="">M</option></select>
      <select id="jumpDay" class="jump-field"><option value="">D</option></select>
      <button type="button" id="jumpGo" class="jump-go">Go</button>
    </label>
    <button class="ghost thread-toggle" id="threadToggleBtn" title="Draw one line through every visible entry, in chronological order"><svg class="thread-icon-svg" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title xmlns="">thread-roll-filled</title><path fill="#8c2e22" d="M6 12.59L11.59 7H6zm12-1.18L12.41 17H18zM18 7h-3.59L6 15.41V17h3.59L18 8.59z"/><rect width="16" height="3" x="4" y="2" fill="#8c2e22" rx=".75" ry=".75"/><rect width="16" height="3" x="4" y="19" fill="#8c2e22" rx=".75" ry=".75"/></svg> Thread: Off</button>
    <label class="small" style="gap:8px;">Position by
      <div class="seg-toggle" id="positionToggle">
        <button type="button" class="seg-btn on" data-mode="event">Event date</button>
        <button type="button" class="seg-btn" data-mode="recorded">First recorded</button>
      </div>
    </label>
    <div class="spacer"></div>
  </div>

  <div id="main-row">
    <div id="board-wrap">
      <div id="loadStatus" class="load-status">Loading timeline…</div>
      <div id="board-inner">
        <div id="rail"></div>
        <!-- columns injected here -->
      </div>
    </div>

    <div id="focusPanel" class="focus-panel">
      <div class="focus-panel-inner" id="focusPanelInner"></div>
    </div>
  </div>

  <footer class="hint" id="hintFooter">
    <span id="hintFooterText">Click any entry for details and nearby events.</span>
    <span class="footer-actions">
      <button type="button" class="report-flag-btn" id="reportGeneralBtn" title="Report a problem or suggest a correction">&#9873; Report an issue</button>
      <a href="admin/" class="admin-toggle" id="cmsLoginLink">&#9919; Log in</a>
    </span>
  </footer>
</div>

<script>
(async function(){

  /* ============================= DATA MODEL ============================= */

  // Categories, themes, and all entries/sources now live in Supabase
  // (project wmsssandsdjpzpripirc) instead of being baked into this file.
  // See fetchState() below, which reads them through the public_entries /
  // public_sources views. The full editorial rationale that used to live in
  // comments here (lane exclusivity, theme tagging, source-provenance model)
  // is preserved in the project's SCHEMA-AND-SECURITY doc.

  // This page is read-only: all editing now happens in the separate admin
  // CMS, which writes to the same Supabase project. The URL below is not a
  // secret -- it's the public "street address" of the database, the same way
  // a web address is public. What it can and can't be used to do is decided
  // entirely by the server-side security rules (Row Level Security), not by
  // keeping this URL or key hidden. See the project's SCHEMA-AND-SECURITY doc
  // for the full explanation.
  var SUPABASE_URL = 'https://wmsssandsdjpzpripirc.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_iXLB40Zxg7DKxLy70YDrvA_UuefY3ZV';

  // ---- Issue reporting ----
  // SET THIS before sharing the file. Submitting a report opens the visitor's
  // own email program with the message pre-filled addressed here; nothing is
  // transmitted by the page itself.
  // Worth considering: an address placed in a publicly shared HTML file can be
  // harvested by spam scrapers, so a dedicated or alias address is safer than a
  // primary personal one.
  var REPORT_EMAIL = 'you@example.com';

  // Each category carries two labels: `short` goes in the email subject line so
  // reports stay scannable and sortable in an inbox, while `label` is the fuller
  // description shown in the dropdown.
  var FLAG_CATEGORIES = [
    {short:'Date questioned',    label:'Date questioned — event or recorded date looks wrong'},
    {short:'Source problem',     label:'Source problem — missing, broken link, or does not support the claim'},
    {short:'Factual error',      label:'Factual error — in the title or notes'},
    {short:'Neutrality concern', label:'Neutrality concern — directive or judging language'},
    {short:'Missing context',    label:'Missing context — something important omitted'},
    {short:'Duplicate entry',    label:'Duplicate entry'},
    {short:'Technical problem',  label:'Display or technical problem'},
    {short:'Other',              label:'Other'}
  ];

  // Reads categories, themes, entries and sources from Supabase. Entries and
  // sources come through the public_entries / public_sources views, which
  // hand back only reader-facing columns (no editor notes, no review
  // history) regardless of what this page asks for -- that filtering happens
  // on the server, not here. See SCHEMA-AND-SECURITY.md.
  function supaFetch(pathAndQuery){
    return fetch(SUPABASE_URL + '/rest/v1/' + pathAndQuery, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      }
    }).then(function(res){
      if(!res.ok){
        throw new Error('Request to ' + pathAndQuery + ' failed (HTTP ' + res.status + ')');
      }
      return res.json();
    });
  }

  function fetchState(){
    return Promise.all([
      supaFetch('categories?select=id,name,color,sort_order&order=sort_order.asc'),
      supaFetch('themes?select=id,name,color'),
      supaFetch('public_entries?select=*'),
      supaFetch('public_sources?select=*&order=entry_id.asc,sort_order.asc')
    ]).then(function(results){
      var categories = results[0];
      var themes = results[1];
      var rawEntries = results[2];
      var rawSources = results[3];

      var sourcesByEntry = {};
      rawSources.forEach(function(s){
        if(!sourcesByEntry[s.entry_id]) sourcesByEntry[s.entry_id] = [];
        sourcesByEntry[s.entry_id].push({
          text: s.text,
          url: s.url || '',
          sy: s.sy,
          sm: s.sm,
          sd: s.sd,
          sApprox: !!s.s_approx,
          access: s.access || ''
        });
      });

      // Archived cards are left out of ordinary browsing. Nothing can be
      // archived yet -- that's an admin CMS action and the CMS doesn't exist
      // yet -- so this filter is dormant for now, not currently removing
      // anything. It's here so the viewer already behaves correctly the
      // moment archiving becomes possible, rather than needing a return trip
      // to this file later.
      var entries = rawEntries
        .filter(function(e){ return !e.is_archived; })
        .map(function(e){
          return {
            id: e.id,
            refId: e.ref_id,
            cat: e.category_id,
            importance: e.importance,
            title: e.title,
            desc: e.description,
            y: e.y, m: e.m, d: e.d, approx: !!e.approx,
            recordedY: e.recorded_y, recordedM: e.recorded_m, recordedD: e.recorded_d,
            recordedApprox: !!e.recorded_approx,
            people: e.people || [],
            themes: e.themes || [],
            researchNotes: e.research_notes,
            isFlagged: !!e.is_flagged,
            flagReason: e.flag_reason,
            sources: sourcesByEntry[e.id] || []
          };
        });

      return {categories: categories, themes: themes, entries: entries};
    });
  }

  var state;
  try{
    state = await fetchState();
  }catch(err){
    console.error('Failed to load timeline data from Supabase:', err);
    var loadStatusEl = document.getElementById('loadStatus');
    if(loadStatusEl){
      loadStatusEl.textContent = 'Could not load the timeline. Please check your connection and reload the page.';
      loadStatusEl.classList.add('load-error');
    }
    return; // Nothing below this point can run without data.
  }
  var loadStatusDone = document.getElementById('loadStatus');
  if(loadStatusDone) loadStatusDone.remove();

  var uiState = {
    collapsedCats: {},
    search: '',
    person: '',
    theme: '',
    zoom: 80,
    selectedId: null,
    nearbyMonths: 2,
    threadOn: false,
    positionBy: 'event',
    // Visitor's own on-screen column order — anyone can drag columns to
    // rearrange them for their own navigation. Intentionally NOT saved
    // anywhere, so it resets to the default order on refresh.
    colOrder: null
  };
  var dragCatId = null;

  /* ============================= FOCUS WORKSPACE ============================= */
  // A personal, local workspace — pin entries here to build your own thread or
  // theory. This never touches the shared board data, so it's available to
  // every visitor, admin or not. Stored separately from the board's dataset.

  var FOCUS_STORAGE_KEY = 'js_timeline_focus_v1';
  var dragFocusEntryId = null;

  function loadFocusState(){
    try{
      var raw = localStorage.getItem(FOCUS_STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.ids)){
          return {
            title: parsed.title || '',
            notes: parsed.notes || '',
            ids: parsed.ids,
            open: !!parsed.open
          };
        }
      }
    }catch(e){}
    return {title:'', notes:'', ids:[], open:false};
  }
  var focusState = loadFocusState();
  function saveFocusState(){
    localStorage.setItem(FOCUS_STORAGE_KEY, JSON.stringify(focusState));
  }

  function isPinned(id){ return focusState.ids.indexOf(id) !== -1; }

  function addToFocus(id){
    if(!isPinned(id)){
      focusState.ids.push(id);
      saveFocusState();
      renderFocusList();
      render();
    }
  }
  function removeFromFocus(id){
    var i = focusState.ids.indexOf(id);
    if(i !== -1){
      focusState.ids.splice(i, 1);
      saveFocusState();
      renderFocusList();
      render();
    }
  }
  function toggleFocus(id){ isPinned(id) ? removeFromFocus(id) : addToFocus(id); }
  function clearFocus(){
    if(!focusState.ids.length) return;
    if(confirm('Clear all pinned entries from your Focus panel? This only clears your workspace — no board data is affected.')){
      focusState.ids = [];
      saveFocusState();
      renderFocusList();
      render();
    }
  }

  function sortedFocusEntries(){
    return focusState.ids
      .map(function(id){ return state.entries.find(function(e){ return e.id === id; }); })
      .filter(Boolean)
      .sort(function(a,b){
        var fa = fracYear(a), fb = fracYear(b);
        if(fa !== fb) return fa - fb;
        return a.title.localeCompare(b.title);
      });
  }

  function catById(id){
    for(var i=0;i<state.categories.length;i++) if(state.categories[i].id===id) return state.categories[i];
    return null;
  }

  // Display order for columns: the visitor's own drag-to-reorder (uiState.colOrder)
  // takes precedence over the board's underlying category order, but only for
  // categories it still knows about — anything newly added/removed by an admin
  // since the visitor last dragged just falls back to the board's own order.
  function orderedCategories(){
    if(!uiState.colOrder) return state.categories.slice();
    var remaining = {};
    state.categories.forEach(function(c){ remaining[c.id] = c; });
    var result = [];
    uiState.colOrder.forEach(function(id){
      if(remaining[id]){ result.push(remaining[id]); delete remaining[id]; }
    });
    state.categories.forEach(function(c){
      if(remaining[c.id]) result.push(c);
    });
    return result;
  }

  function themeById(id){
    for(var i=0;i<(state.themes||[]).length;i++) if(state.themes[i].id===id) return state.themes[i];
    return null;
  }

  // Relative luminance (WCAG), used to decide what to print on a category color.
  function relLuminance(hex){
    var h = String(hex || '').replace('#','');
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    if(!/^[0-9a-f]{6}$/i.test(h)) return 0;
    function chan(v){
      v = parseInt(v, 16) / 255;
      return v <= 0.03928 ? v/12.92 : Math.pow((v + 0.055)/1.055, 2.4);
    }
    return 0.2126*chan(h.slice(0,2)) + 0.7152*chan(h.slice(2,4)) + 0.0722*chan(h.slice(4,6));
  }

  // Cream on dark colors, ink on light ones. The five default categories are all
  // dark enough for cream, but category colors are editable via a color picker,
  // so a pale choice must not leave the title unreadable. The 0.197 threshold is
  // where cream and ink give equal contrast against the same background.
  function readableOn(hex){
    return relLuminance(hex) > 0.197 ? '#2A2420' : '#F3ECDA';
  }

  /* ---------- Source provenance ---------- */
  // A source may carry: sy/sm/sd (the date it was written or told, year enough),
  // sApprox, and access ('firsthand' | 'secondhand' | 'unknown'). Timing and the
  // year-gap are DERIVED from sy against the entry's event year — never typed.
  //
  // These thresholds are placeholders pending the historian conversation; they
  // live here so they can be retuned in one place. 'transmission' (independent /
  // dependent) is deliberately NOT built yet — it is the axis that most needs a
  // historian and is a later phase.
  var TIMING_BANDS = { immediateMax: 0, contemporaryMax: 3 }; // gap in years: 0 = immediate, 1\u20133 = contemporary, 4+ = retrospective

  function sourceGapYears(entry, src){
    if(src.sy === undefined || src.sy === null || entry.y === undefined) return null;
    return src.sy - entry.y;
  }
  function timingBand(gap){
    if(gap === null) return null;
    var g = Math.abs(gap);
    if(g <= TIMING_BANDS.immediateMax) return 'immediate';
    if(g <= TIMING_BANDS.contemporaryMax) return 'contemporary';
    return 'retrospective';
  }
  // Renders the small tag line under a source. Returns '' when the source has no
  // provenance data at all, so untagged sources look exactly as they do now.
  function sourceTagsMarkup(entry, src){
    var hasAccess = src.access && src.access !== 'unknown';
    var gap = sourceGapYears(entry, src);
    var band = timingBand(gap);
    if(!hasAccess && gap === null) return '';
    var bits = [];
    if(hasAccess){
      var firsthand = src.access === 'firsthand';
      bits.push('<span class="src-tag"><span class="src-dot '+(firsthand?'filled':'hollow')+'"></span>'+
        (firsthand ? 'firsthand' : 'secondhand')+'</span>');
    }
    if(band){
      bits.push('<span class="src-tag">'+band+'</span>');
    }
    if(gap !== null){
      var g = Math.abs(gap);
      var gapText = g === 0 ? 'same year' : ('~'+g+' yr gap');
      var when = (src.sy!==undefined && src.sy!==null) ? ((src.sApprox?'c. ':'')+'written '+src.sy+' \u00b7 ') : '';
      bits.push('<span class="src-gap">\u00b7 '+when+gapText+'</span>');
    }
    return '<div class="src-tags">'+bits.join('')+'</div>';
  }

  // Days in each month (index 0 = Jan). Leap years are ignored: at day zoom a
  // single day is ~22px, so Feb 29 vs. the /28 slot is a sub-pixel difference
  // not worth the complication, and no entry in this dataset is Feb 29.
  var MONTH_DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];

  // Convert a (year, month 1-12, day 1-31) to a fractional year, the single
  // source of truth for vertical position of BOTH rail ticks and entry cards.
  //
  // The key correctness point (fixes the ragged month ends seen at day zoom):
  // a day is placed as a fraction of ITS OWN month's actual length, spread
  // across that month's 1/12 slot — NOT as a fixed 1/365 of a year. The old
  // math added (day-1)/365 on top of a 1/12 month slot, so 28-day months left a
  // gap and 31-day months overflowed into the next month's label. Now day D in
  // an N-day month sits at (D-1)/N of the way through the month slot, so every
  // month fills its slot exactly and day ticks are evenly spaced month to month.
  //
  // monthlessMid: when there's no month, where to place the entry in the year.
  // Entries default to mid-year (0.5) so a year-only card sits in the middle of
  // its year; ticks pass 0 to sit at the year's start.
  function ymdToFracYear(y, m, d, monthlessMid){
    if(!m) return y + (monthlessMid ? 0.5 : 0);
    var monthStart = (m - 1) / 12;               // start of this month within the year
    var slot = 1 / 12;                            // every month occupies 1/12 of the year's height
    var dim = MONTH_DAYS[m - 1] || 30;
    var dayFrac = d ? ((d - 1) / dim) * slot : 0; // day placed within its own month's slot
    return y + monthStart + dayFrac;
  }

  function fracYear(e){
    return ymdToFracYear(e.y, e.m || 0, e.d || 0, true);
  }

  function dateLabel(e){
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var s = '';
    if(e.d && e.m) s = months[e.m-1] + ' ' + e.d + ', ' + e.y;
    else if(e.m) s = months[e.m-1] + ' ' + e.y;
    else s = String(e.y);
    if(e.approx) s = 'c. ' + s;
    return s;
  }

  // A "recorded date" is when an account was first written down or told —
  // distinct from the date of the event itself. Many recollections
  // (e.g. priesthood restoration accounts) were set down years after the fact.
  function hasRecordedDate(e){ return e.recordedY !== undefined && e.recordedY !== null; }
  function recordedFracYear(e){ return fracYear({y: e.recordedY, m: e.recordedM, d: e.recordedD}); }
  function recordedDateLabel(e){ return dateLabel({y: e.recordedY, m: e.recordedM, d: e.recordedD, approx: e.recordedApprox}); }
  function isRetrospective(e){ return hasRecordedDate(e) && (recordedFracYear(e) - fracYear(e) > 0.4); }
  // Which date actually places the card on the board, honoring the "Position by" toggle.
  function positionFracYear(e){
    if(uiState.positionBy === 'recorded' && hasRecordedDate(e)) return recordedFracYear(e);
    return fracYear(e);
  }

  /* ============================= RENDER ============================= */

  var boardInner = document.getElementById('board-inner');
  var rail = document.getElementById('rail');
  var PADDING_TOP = 40;
  var PADDING_BOTTOM = 60;

  // ---- Zoom scale: signposts, slider mapping, adaptive rail granularity ----
  // zoom is pxPerYear. The slider is CONTINUOUS but marked with five signposts
  // (default / year / month / day) at meaningful pxPerYear levels. Day
  // level is ~18x year level, so a linear slider would cram the deep end into a
  // sliver of travel; instead the slider position (0..1000) maps to pxPerYear
  // LOGARITHMICALLY, which spaces the signposts evenly along the track and makes
  // scrubbing feel consistent everywhere.
  //
  // "default" is the current overview (the comfortable whole-life shot), kept as
  // the leftmost signpost so the tool still opens where it always has. The
  // labelled stops step progressively inward from there.
  var ZOOM_MIN = 80;      // the default overview — leftmost slider position (the home view)
  var ZOOM_MAX = 25000;   // day level — one day ≈ a full card-height + gap (~68px), so two
                          // events on different days can never overlap. This is what lets the
                          // old fan mechanism be retired entirely: at max zoom there is simply
                          // nothing left to fan. The ~830k-px board height this implies is inert —
                          // tick culling only renders the visible window, and the date picker
                          // (not scrolling) is how you travel here.
  var ZOOM_SIGNPOSTS = [
    { key:'default', label:'',        px: 80    },  // current overview; unlabelled
    { key:'year',    label:'Year',    px: 480   },
    { key:'month',   label:'Month',   px: 2400  },
    { key:'day',     label:'Day',     px: 25000 }
  ];
  var SLIDER_RESOLUTION = 1000; // slider runs 0..1000; mapped to px logarithmically

  function sliderToZoom(sliderVal){
    var t = Math.max(0, Math.min(1, sliderVal / SLIDER_RESOLUTION));
    return Math.round(ZOOM_MIN * Math.pow(ZOOM_MAX / ZOOM_MIN, t));
  }
  function zoomToSlider(px){
    var clamped = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, px));
    var t = Math.log(clamped / ZOOM_MIN) / Math.log(ZOOM_MAX / ZOOM_MIN);
    return Math.round(t * SLIDER_RESOLUTION);
  }

  // The pxPerYear a given date-precision implies, used by the date picker's Go
  // so choosing a day zooms to day level, a month to month level, etc.
  function zoomForPrecision(precision){
    var sp = ZOOM_SIGNPOSTS.filter(function(s){ return s.key === precision; })[0];
    return sp ? sp.px : 80;
  }

  // Choose rail tick granularity from the current zoom so ticks are legible at
  // every depth: multi-year when zoomed out, then yearly, monthly, daily as you
  // go deeper. Returns {unit, step} where unit is 'year'|'month'|'day' and step
  // is how many of that unit between ticks.
  function railGranularity(pxPerYear){
    if(pxPerYear >= 5000) return { unit:'day',   step:1 };   // ~22px/day: single days readable
    if(pxPerYear >= 2600) return { unit:'day',   step:2 };   // every other day
    if(pxPerYear >= 1100) return { unit:'day',   step:7 };   // weekly ticks
    if(pxPerYear >= 520)  return { unit:'month', step:1 };   // monthly
    if(pxPerYear >= 240)  return { unit:'month', step:3 };   // quarterly
    if(pxPerYear >= 110)  return { unit:'year',  step:1 };   // yearly
    if(pxPerYear >= 55)   return { unit:'year',  step:2 };
    if(pxPerYear >= 28)   return { unit:'year',  step:5 };
    return { unit:'year', step:10 };
  }

  var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Position of a rail tick, using the SAME month-aware math as entry cards
  // (ymdToFracYear) so ticks and cards line up exactly. Ticks sit at the start
  // of their unit (monthlessMid = false), unlike entries which default to
  // mid-year when they have no month.
  function tickFracYear(y, m, d){
    return ymdToFracYear(y, m || 0, d || 0, false);
  }

  // Produces the tick list for the rail/gridlines at a given granularity.
  // Each tick: {fy, label, major}. "major" ticks are heavier (year starts, or
  // round years) so the eye still finds year boundaries at fine zoom.
  //
  // visRange (optional) is {minFy, maxFy}: only ticks within it are generated.
  // At fine granularity (month/day) over a 50-year span this is essential —
  // otherwise day-level would emit ~20k DOM nodes for a board you can only see
  // a sliver of. At coarse (year) granularity the whole span is cheap, so the
  // clamp is applied everywhere uniformly but only matters when zoomed in.
  function buildRailTicks(bounds, gran, visRange){
    var ticks = [];
    var lo = visRange ? visRange.minFy : -Infinity;
    var hi = visRange ? visRange.maxFy : Infinity;
    function inRange(fy){ return fy >= lo && fy <= hi; }
    var y;
    if(gran.unit === 'year'){
      var startY = Math.ceil(bounds.min / gran.step) * gran.step;
      for(y = startY; y <= bounds.max; y += gran.step){
        if(!inRange(y)) continue;
        ticks.push({ fy: y, label: String(y), ty: y, kind: 'year', major: (y % (gran.step*5===0?gran.step:5) === 0) || gran.step >= 5 });
      }
    } else if(gran.unit === 'month'){
      var my0 = Math.max(bounds.min, Math.floor(lo) - 1);
      var my1 = Math.min(bounds.max, Math.ceil(hi) + 1);
      for(y = my0; y <= my1; y++){
        for(var m = 1; m <= 12; m += gran.step){
          var fyM = tickFracYear(y, m, 0);
          if(!inRange(fyM)) continue;
          var majorM = (m === 1);
          ticks.push({ fy: fyM, label: MONTH_ABBR[m-1], monthLabel: MONTH_ABBR[m-1], ty: y, tmo: m, kind: 'month', major: majorM });
        }
      }
    } else { // day
      var dy0 = Math.max(bounds.min, Math.floor(lo) - 1);
      var dy1 = Math.min(bounds.max, Math.ceil(hi) + 1);
      for(y = dy0; y <= dy1; y++){
        for(var mo = 1; mo <= 12; mo++){
          var dim = MONTH_DAYS[mo-1];
          for(var da = 1; da <= dim; da += gran.step){
            var fyD = tickFracYear(y, mo, da);
            if(!inRange(fyD)) continue;
            var startOfMonth = (da === 1);
            var label, kind, monthLabel;
            if(startOfMonth){
              label = MONTH_ABBR[mo-1]; monthLabel = MONTH_ABBR[mo-1]; kind = 'month';
            } else if(gran.step === 1){
              label = String(da); kind = 'day';
            } else {
              label = MONTH_ABBR[mo-1] + ' ' + da; kind = 'day';
            }
            ticks.push({ fy: fyD, label: label, monthLabel: monthLabel, ty: y, tmo: mo, kind: kind, major: startOfMonth });
          }
        }
      }
    }
    return ticks;
  }


  // Every date-to-vertical-position conversion in the app goes through
  // dateToY(), and every pixel-to-date conversion through yToDate(). Today the
  // mapping is a plain linear ratio (pxPerYear, driven by the zoom slider), so
  // these are simple arithmetic. They are centralised here deliberately: an
  // elastic/density-driven rail was tried (see changelog 54) and reverted for
  // being too visually destabilising — but the plumbing that made it a
  // one-place change is kept, so any future alternative scale still swaps in
  // here alone with no caller needing to know how the mapping works.
  //
  // Both take the current bounds and pxPerYear explicitly rather than reading
  // globals, so they stay pure and testable. yToDate is the exact inverse of
  // dateToY and MUST remain so — the zoom control relies on round-tripping a
  // date through both to keep the same point centred as the scale changes.
  function dateToY(fy, bounds, pxPerYear){
    return PADDING_TOP + (fy - bounds.min) * pxPerYear;
  }
  function yToDate(y, bounds, pxPerYear){
    return bounds.min + (y - PADDING_TOP) / pxPerYear;
  }

  function minMaxYear(){
    var min = Infinity, max = -Infinity;
    state.entries.forEach(function(e){
      if(e.y < min) min = e.y;
      if(e.y > max) max = e.y;
      if(hasRecordedDate(e)){
        if(e.recordedY < min) min = e.recordedY;
        if(e.recordedY > max) max = e.recordedY;
      }
    });
    if(!isFinite(min)){ min = 1800; max = 1850; }
    return {min: Math.floor(min)-1, max: Math.ceil(max)+1};
  }

  // Thin wrapper kept so existing call sites read the same; routes through
  // dateToY so there is still only one mapping implementation.
  function yFor(fy, bounds, pxPerYear){
    return dateToY(fy, bounds, pxPerYear);
  }

  function totalHeight(bounds, pxPerYear){
    return dateToY(bounds.max, bounds, pxPerYear) + PADDING_BOTTOM;
  }

  function matchesFilters(e){
    var s = uiState.search.trim().toLowerCase();
    if(s){
      var sourceText = (e.sources||[]).map(function(s){ return s.text+' '+s.url; }).join(' ');
      var hay = (e.title+' '+(e.desc||'')+' '+(e.researchNotes||'')+' '+(e.people||[]).join(' ')+' '+sourceText).toLowerCase();
      if(hay.indexOf(s) === -1) return false;
    }
    if(uiState.person){
      if(!(e.people||[]).includes(uiState.person)) return false;
    }
    if(uiState.theme){
      if(!(e.themes||[]).includes(uiState.theme)) return false;
    }
    return true;
  }

  function allPeople(){
    var set = {};
    state.entries.forEach(function(e){ (e.people||[]).forEach(function(p){ set[p]=true; }); });
    return Object.keys(set).sort();
  }

  function render(){
    var bounds = minMaxYear();
    var pxPerYear = uiState.zoom;
    var th = totalHeight(bounds, pxPerYear);

    // Build the list of tick positions once, shared by the rail and gridlines,
    // at a granularity chosen from the current zoom (see railGranularity).
    // At fine zoom, generating ticks for the whole 50-year span would emit tens
    // of thousands of nodes, so we clamp to the visible viewport plus a margin.
    var gran = railGranularity(pxPerYear);
    var boardWrapEl = document.getElementById('board-wrap');
    var visRange = null;
    if(gran.unit !== 'year'){
      var scrollTop = boardWrapEl ? boardWrapEl.scrollTop : 0;
      var vpH = boardWrapEl ? boardWrapEl.clientHeight : 800;
      var margin = vpH * 2; // a couple screens of slack so scrolling stays smooth
      visRange = {
        minFy: yToDate(scrollTop - margin, bounds, pxPerYear),
        maxFy: yToDate(scrollTop + vpH + margin, bounds, pxPerYear)
      };
    }
    var ticks = buildRailTicks(bounds, gran, visRange);

    // Rail. Ticks are placed top-to-bottom. Two crowding problems to solve at
    // day zoom: minor day numbers piling on each other, and minor numbers
    // colliding with the bold month/year labels (the "Nov 29 / Dec" overlap).
    // Fix: decide label visibility in a pass that gives MAJOR labels (month
    // starts, years) absolute priority — a minor label is blanked if it's
    // within MIN_LABEL_GAP px of ANY major (above or below) or of the previous
    // shown minor. Tick MARKS always draw; only text is suppressed, so the fine
    // ruling stays intact.
    //
    // Orientation at deep zoom: once no year tick is on screen you can lose
    // track of the year. So the YEAR is appended to the month label in two
    // cases — every January (the natural year boundary) and the TOPMOST month
    // label currently in view — so "Jun 1844" tells you where you are even when
    // you've scrolled into the middle of a year. Plain months below it stay
    // uncluttered ("Jul", "Aug") until the next January.
    var MIN_LABEL_GAP = 15;
    var MAJOR_GAP = 17; // a little more clearance around the heavier major labels
    rail.innerHTML = '';
    rail.style.height = th + 'px';
    var tickYs = ticks.map(function(t){ return yFor(t.fy, bounds, pxPerYear); });
    var majorYs = [];
    ticks.forEach(function(t, i){ if(t.major) majorYs.push(tickYs[i]); });
    function nearAnyMajor(y){
      for(var k = 0; k < majorYs.length; k++){
        if(Math.abs(y - majorYs[k]) < MAJOR_GAP) return true;
      }
      return false;
    }

    // Find the topmost month-kind tick within the current viewport; it will
    // carry the year even if it isn't January.
    var viewTop = boardWrapEl ? boardWrapEl.scrollTop : 0;
    var topmostMonthIdx = -1;
    for(var vi = 0; vi < ticks.length; vi++){
      if((ticks[vi].kind === 'month') && tickYs[vi] >= viewTop - 2){
        topmostMonthIdx = vi;
        break;
      }
    }

    var lastShownMinorY = -Infinity;
    ticks.forEach(function(t, i){
      var topY = tickYs[i];
      var mark = document.createElement('div');
      mark.className = 'year-mark' + (t.major ? ' major' : '');
      mark.style.top = topY + 'px';
      // Compute the display label, adding the year to month labels where it aids
      // orientation (January, or the topmost visible month).
      var displayLabel = t.label;
      if(t.kind === 'month'){
        var wantYear = (t.tmo === 1) || (i === topmostMonthIdx);
        displayLabel = wantYear ? (t.monthLabel + ' ' + t.ty) : t.monthLabel;
      }
      var show;
      if(t.major){
        show = !!displayLabel;
      } else {
        show = displayLabel && !nearAnyMajor(topY) && (topY - lastShownMinorY) >= MIN_LABEL_GAP;
      }
      if(show){
        mark.textContent = displayLabel;
        if(!t.major) lastShownMinorY = topY;
      } else {
        mark.textContent = '';
      }
      rail.appendChild(mark);
    });

    // Clear old columns + gridlines + svg
    Array.prototype.slice.call(boardInner.querySelectorAll('.column, .gridline, #thread-svg')).forEach(function(n){ n.remove(); });

    // Every category gets a column; collapsing narrows one to a 40px strip
    // rather than removing it, so nothing ever disappears from the board.
    var visibleCats = orderedCategories();
    var totalColW = visibleCats.reduce(function(sum, c){ return sum + (uiState.collapsedCats[c.id] ? 40 : 258); }, 0);

    // Gridlines (behind columns, spans full width) — same ticks as the rail.
    ticks.forEach(function(t){
      var g = document.createElement('div');
      g.className = 'gridline' + (t.major ? ' major' : '');
      g.style.top = yFor(t.fy, bounds, pxPerYear) + 'px';
      g.style.width = totalColW + 'px';
      boardInner.appendChild(g);
    });

    // Columns
    visibleCats.forEach(function(cat){
      var isCollapsed = !!uiState.collapsedCats[cat.id];
      var col = document.createElement('div');
      col.className = 'column' + (isCollapsed ? ' collapsed' : '');
      col.style.height = th + 'px';
      col.style.setProperty('--cat-color', cat.color);
      col.dataset.catId = cat.id;

      var header = document.createElement('div');
      header.className = 'column-header';
      header.style.setProperty('--cat-color', cat.color);
      // Collapsed headers hold rotated (writing-mode: vertical-rl) text, and a
      // few browsers fail to paint that rotated text at all when its container
      // is also natively draggable — so dragging is only enabled while expanded.
      // (You can still reorder a collapsed column: expand it, drag, re-collapse.)
      header.draggable = !isCollapsed;
      var catEntries = state.entries.filter(function(e){ return e.cat === cat.id; });
      header.innerHTML =
        '<div class="name">'+(isCollapsed ? '' : '<span class="drag-handle" title="Drag to reorder — resets on refresh">&#8942;&#8942;</span>')+'<span class="cat-label">'+escapeHtml(cat.name)+'</span></div>'+
        '<div class="meta-row">'+
        '<span class="col-controls">'+
          '<button class="collapse-btn" data-collapse="'+cat.id+'" title="'+(isCollapsed?'Expand':'Collapse')+'">'+(isCollapsed?'&#9656;':'&#9666;')+'</button>'+
        '</span></div>';
      col.appendChild(header);

      if(isCollapsed){
        header.addEventListener('click', function(ev){
          if(ev.target.closest('.collapse-btn')) return;
          uiState.collapsedCats[cat.id] = false;
          render();
        });
      }

      header.querySelector('.collapse-btn').addEventListener('click', function(ev){
        ev.stopPropagation();
        var id = ev.currentTarget.dataset.collapse;
        uiState.collapsedCats[id] = !uiState.collapsedCats[id];
        render();
      });

      if(catEntries.length === 0){
        var msg = document.createElement('div');
        msg.className = 'empty-col-msg';
        msg.textContent = 'No entries yet.';
        col.appendChild(msg);
      }

      catEntries.forEach(function(e){
        var card = document.createElement('div');
        card.className = 'entry-card' + (isPinned(e.id) ? ' in-focus' : '');
        card.dataset.id = e.id;
        card.draggable = true;
        var fy = positionFracYear(e);
        var baseTop = yFor(fy, bounds, pxPerYear);
        card.style.top = baseTop + 'px';
        card.dataset.basetop = baseTop; // pristine date-based position; applyCardStagger reads this, never the mutated style.top
        card.dataset.importance = e.importance || 'routine'; // landmark|notable|routine — decides which card is frontmost in a stack
        card.style.setProperty('--cat-color', cat.color);
        if(!matchesFilters(e)) card.classList.add('dimmed');
        if(e.id === uiState.selectedId) card.classList.add('selected');
        var retroBadge = isRetrospective(e) ? '<span class="retro-mark" title="Recorded later, as a retrospective account — see details">R</span>' : '';
        var dateShown = (uiState.positionBy === 'recorded' && hasRecordedDate(e)) ? ('Recorded '+recordedDateLabel(e)) : dateLabel(e);
        var pinned = isPinned(e.id);
        card.innerHTML = '<button type="button" class="pin-btn'+(pinned?' pinned':'')+'" data-id="'+e.id+'" title="'+(pinned?'Remove from Focus':'Add to Focus')+'">'+(pinned?'&#10003;':'&#9758;')+'</button>'+
          '<div class="date-line">'+dateShown+retroBadge+'</div><div class="title-line">'+escapeHtml(e.title)+'</div>';
        card.addEventListener('click', function(ev){
          if(ev.target.closest('.pin-btn')) return;
          var id = ev.currentTarget.dataset.id;
          openDetail(id);
        });
        card.querySelector('.pin-btn').addEventListener('click', function(ev){
          ev.stopPropagation();
          toggleFocus(ev.currentTarget.dataset.id);
        });
        card.addEventListener('dragstart', function(ev){
          dragFocusEntryId = e.id;
          ev.dataTransfer.effectAllowed = 'copy';
          try{ ev.dataTransfer.setData('text/plain', e.id); }catch(err){}
        });
        card.addEventListener('dragend', function(){
          dragFocusEntryId = null;
          var panel = document.getElementById('focusPanel');
          if(panel) panel.classList.remove('drag-over');
        });
        col.appendChild(card);
      });

      // Drag-and-drop reordering — a viewing convenience open to every visitor.
      // It only ever touches uiState.colOrder (never state.categories), so it's
      // never saved and resets to the board's default order on refresh.
      header.addEventListener('dragstart', function(ev){
        dragCatId = cat.id;
        col.classList.add('dragging');
        ev.dataTransfer.effectAllowed = 'move';
        try{ ev.dataTransfer.setData('text/plain', cat.id); }catch(e){}
      });
      header.addEventListener('dragend', function(){
        col.classList.remove('dragging');
        document.querySelectorAll('.column.drag-over').forEach(function(n){ n.classList.remove('drag-over'); });
      });
      col.addEventListener('dragover', function(ev){
        if(!dragCatId || dragCatId === cat.id) return;
        ev.preventDefault();
        col.classList.add('drag-over');
      });
      col.addEventListener('dragleave', function(){
        col.classList.remove('drag-over');
      });
      col.addEventListener('drop', function(ev){
        ev.preventDefault();
        col.classList.remove('drag-over');
        if(!dragCatId || dragCatId === cat.id) return;
        var current = orderedCategories().map(function(c){ return c.id; });
        var fromIdx = current.indexOf(dragCatId);
        var toIdx = current.indexOf(cat.id);
        if(fromIdx === -1 || toIdx === -1) return;
        var moved = current.splice(fromIdx, 1)[0];
        current.splice(toIdx, 0, moved);
        uiState.colOrder = current;
        dragCatId = null;
        render();
      });

      boardInner.appendChild(col);
    });

    applyCardStagger();

    // SVG thread overlay
    var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('id','thread-svg');
    svg.setAttribute('width', (96+totalColW));
    svg.setAttribute('height', th);
    boardInner.insertBefore(svg, boardInner.firstChild.nextSibling);

    drawThreads(bounds, pxPerYear);
    renderPersonFilter();
    renderThemeFilter();
  }

  // Cards close enough in time to visually overlap form a "cluster." Overlapping
  // cards are staggered sideways like a fanned deck of index cards so the ones
  // underneath stay partly visible, and the top card carries a ⊕N readout badge
  // saying how many are stacked. The badge is a READOUT, not a control — it
  // invites zooming in (deep zoom, down to one day per card-height, fully
  // separates any cluster). The old click-to-fan-out mechanism was retired in
  // v70 once max zoom became deep enough to make it unnecessary.
  //
  // Runs fresh on every render, so it self-corrects at any zoom: as you zoom in
  // and cards stop overlapping, clusters dissolve and the stagger and badge
  // simply disappear.
  // Importance tier -> numeric rank, for deciding which card sits frontmost in
  // a stack. landmark (3) > notable (2) > routine (1, the default). Read from
  // the card's stamped dataset. Admin-set per entry; affects stack order only,
  // never what a reader can reach.
  var IMPORTANCE_RANK = { landmark: 3, notable: 2, routine: 1 };
  function importanceRank(card){
    return IMPORTANCE_RANK[card.dataset.importance] || 1;
  }

  function applyCardStagger(){
    var STAGGER_PX = 16;
    var MAX_DEPTH = 5;
    // Pristine date position of a card, stamped at render time. Reading this
    // rather than style.top keeps the pass idempotent — re-running never
    // compounds, positions are recomputed from scratch every time.
    function baseOf(card){ return parseFloat(card.dataset.basetop); }
    document.querySelectorAll('.column').forEach(function(col){
      if(col.classList.contains('collapsed')) return;
      var cards = Array.prototype.slice.call(col.querySelectorAll('.entry-card'));
      if(cards.length < 1) return;
      cards.sort(function(a,b){ return baseOf(a) - baseOf(b); });

      // Group cards into clusters by vertical overlap (using pristine tops).
      var clusters = [];
      var cur = null;
      var clusterBottom = -Infinity;
      cards.forEach(function(card){
        var top = baseOf(card);
        var height = card.offsetHeight;
        if(top < clusterBottom && cur){
          cur.push(card);
        } else {
          cur = [card];
          clusters.push(cur);
        }
        clusterBottom = Math.max(clusterBottom, top + height);
      });

      clusters.forEach(function(group){
        // Clear any badge left over from a previous pass.
        group.forEach(function(card){
          var old = card.querySelector('.stack-badge');
          if(old) old.remove();
        });

        if(group.length < 2){
          // Not a cluster — sits at its true date position, no stagger.
          var c = group[0];
          c.style.top = baseOf(c) + 'px';
          c.style.left = '10px';
          c.style.zIndex = (c.classList.contains('selected') || c.classList.contains('related')) ? '1200' : '200';
          return;
        }

        // Overlapping cluster. Every card stays anchored to its own date (top);
        // the stagger is purely horizontal + z-order. The FRONTMOST card is the
        // highest-importance one (landmark > notable > routine), ties broken by
        // earliest date — so a scan of a zoomed-out board surfaces the landmark
        // event of each cluster rather than just whatever happened first. The
        // frontmost card sits flush (no inset) and carries the ⊕N badge; the
        // rest fan rightward behind it in date order.
        var ordered = group.slice().sort(function(a, b){
          var ia = importanceRank(a), ib = importanceRank(b);
          if(ia !== ib) return ib - ia;                 // higher importance first
          return baseOf(a) - baseOf(b);                 // then earliest date
        });
        ordered.forEach(function(card, idx){
          var origTop = baseOf(card);
          var depth = Math.min(idx, MAX_DEPTH);
          card.style.top = origTop + 'px';
          card.style.left = (10 + depth * STAGGER_PX) + 'px';
          var z = 200 - depth;
          if(card.classList.contains('selected') || card.classList.contains('related')) z += 1000;
          card.style.zIndex = String(z);
        });
        addStackBadge(ordered[0], group.length);
      });
    });
  }

  // Places a readout badge on the top card of an overlapping cluster: "⊕N",
  // where N is how many cards are stacked underneath. It's a READOUT, not a
  // control — non-interactive (pointer-events:none in CSS) so card clicks pass
  // through — inviting the reader to zoom in, where the cluster separates.
  function addStackBadge(card, total){
    var badge = document.createElement('span');
    badge.className = 'stack-badge';
    badge.title = (total - 1) + ' more here — zoom in to separate';
    badge.innerHTML = '<span class="sb-glyph">&#8853;</span>' + (total - 1); // ⊕N
    card.appendChild(badge);
  }

  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderPersonFilter(){
    var sel = document.getElementById('personFilter');
    var cur = uiState.person;
    sel.innerHTML = '<option value="">All people</option>';
    allPeople().forEach(function(p){
      var opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      if(p === cur) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function renderThemeFilter(){
    var sel = document.getElementById('themeFilter');
    if(!sel) return;
    var cur = uiState.theme;
    sel.innerHTML = '<option value="">All themes</option>';
    (state.themes||[]).forEach(function(t){
      var opt = document.createElement('option');
      opt.value = t.id; opt.textContent = t.name;
      if(t.id === cur) opt.selected = true;
      sel.appendChild(opt);
    });
    // If the previously selected theme was deleted, fall back to "All themes".
    if(cur && !themeById(cur)){
      uiState.theme = '';
      sel.value = '';
    }
  }

  /* ---------- Connection threads (signature element) ---------- */
  function computeRelated(e, months){
    var m = (months !== undefined) ? months : uiState.nearbyMonths;
    var windowYears = m / 12;
    var selFy = fracYear(e);
    return state.entries.filter(function(x){
      return x.id !== e.id && Math.abs(fracYear(x) - selFy) <= windowYears;
    }).sort(function(a,b){ return fracYear(a) - fracYear(b); });
  }

  function cardCenter(id){
    var card = boardInner.querySelector('.entry-card[data-id="'+id+'"]');
    if(!card) return null;
    var col = card.closest('.column');
    // Read the LOGICAL position that applyCardStagger set (style.top/left),
    // not offsetTop/offsetLeft — those report the card's mid-transition
    // position while the fan/collapse animation (.16s) is still running, which
    // made thread lines point where a card was headed from rather than to.
    // Falls back to offset* if a style value isn't set for any reason.
    var topPx = parseFloat(card.style.top);
    var leftPx = parseFloat(card.style.left);
    if(isNaN(topPx)) topPx = card.offsetTop;
    if(isNaN(leftPx)) leftPx = card.offsetLeft;
    return {
      x: leftPx + card.offsetWidth/2 + col.offsetLeft,
      y: topPx + card.offsetHeight/2
    };
  }

  // The "thread": a single line running through every visible entry in
  // chronological order (ties broken alphabetically), crossing columns as needed.
  function buildMasterThreadMarkup(){
    if(!uiState.threadOn) return '';
    var visibleCatIds = {};
    state.categories.forEach(function(c){
      if(!uiState.collapsedCats[c.id]) visibleCatIds[c.id] = true;
    });
    var ordered = state.entries.filter(function(e){
      return visibleCatIds[e.cat] && matchesFilters(e);
    }).sort(function(a,b){
      var fa = positionFracYear(a), fb = positionFracYear(b);
      if(fa !== fb) return fa - fb;
      return a.title.localeCompare(b.title);
    });

    var pts = [];
    ordered.forEach(function(e){
      var c = cardCenter(e.id);
      if(c) pts.push(c);
    });
    if(pts.length < 2) return '';

    var d = 'M ' + pts[0].x + ' ' + pts[0].y;
    for(var i=1;i<pts.length;i++){ d += ' L ' + pts[i].x + ' ' + pts[i].y; }
    var markup = '<path d="'+d+'" stroke="#8c2e22" stroke-opacity="0.6" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    pts.forEach(function(p){
      markup += '<circle cx="'+p.x+'" cy="'+p.y+'" r="2.2" fill="#8c2e22" fill-opacity="0.78"/>';
    });
    return markup;
  }

  // The dashed gold "nearby in time" thread radiating from the currently selected entry.
  function buildSelectionThreadMarkup(){
    if(!uiState.selectedId) return '';
    var sel = state.entries.find(function(e){ return e.id === uiState.selectedId; });
    if(!sel) return '';
    var sc = cardCenter(sel.id);
    if(!sc) return '';
    var related = computeRelated(sel);

    var paths = [];
    related.forEach(function(e){
      var ec = cardCenter(e.id);
      if(!ec) return;
      var card = boardInner.querySelector('.entry-card[data-id="'+e.id+'"]');
      if(card) card.classList.add('related');
      var midx = (sc.x+ec.x)/2;
      var d = 'M '+sc.x+' '+sc.y+' Q '+midx+' '+((sc.y+ec.y)/2)+' '+ec.x+' '+ec.y;
      paths.push('<path d="'+d+'" stroke="#a8862f" stroke-opacity="0.55" stroke-width="1.6" fill="none" stroke-dasharray="1 5" stroke-linecap="round"/>');
      paths.push('<circle cx="'+ec.x+'" cy="'+ec.y+'" r="3" fill="#a8862f" fill-opacity="0.8"/>');
    });
    paths.push('<circle cx="'+sc.x+'" cy="'+sc.y+'" r="4.5" fill="#a8862f"/>');
    return paths.join('');
  }

  // Adding, editing, deleting entries, and managing categories/themes all

  /* ============================= REPORT AN ISSUE ============================= */
  // One shared modal serving two entry points: the flag button in an entry's
  // detail panel (which passes that entry for context) and the one in the page
  // footer (which passes nothing, for a general report).
  //
  // INTERIM DELIVERY: there is no server, so submitting hands the report to the
  // visitor's own email program via a mailto: link. The page transmits nothing
  // itself, and the visitor can read and edit the message before sending. When
  // a backend arrives, only sendReport() below should need to change — the
  // report object it builds is already the shape a database row would take.

  function buildReportText(report){
    var lines = [];
    lines.push('Joseph Smith MultiTimeline — issue report');
    lines.push('');
    if(report.refId || report.entryTitle){
      lines.push('Entry:     ' + (report.refId ? report.refId + ' — ' : '') + (report.entryTitle || ''));
    }else{
      lines.push('Entry:     (general report — not tied to a specific entry)');
    }
    lines.push('Category:  ' + report.category);
    if(report.reporter) lines.push('Reported by: ' + report.reporter);
    lines.push('Submitted: ' + report.submitted);
    lines.push('');
    lines.push('Details:');
    lines.push(report.details);
    return lines.join('\n');
  }

  function sendReport(report){
    // Subject carries the issue type and, when there is one, the entry's ref id
    // — e.g. "MultiTimeline — Source problem — ID-014" — so reports can be
    // sorted and triaged straight from an inbox list without opening them.
    var subject = 'MultiTimeline — ' + report.categoryShort + (report.refId ? ' — ' + report.refId : '');
    var body = buildReportText(report);
    // The address is left unencoded (valid in mailto); subject and body are
    // encoded so line breaks and punctuation survive the trip.
    window.location.href = 'mailto:' + REPORT_EMAIL +
      '?subject=' + encodeURIComponent(subject) +
      '&body=' + encodeURIComponent(body);
  }

  function openReportModal(entry){
    var overlay = document.createElement('div');
    overlay.className = 'overlay center';
    // Option values are indexes, so the label text stays free to change without
    // the lookup depending on exact string matching.
    var catOptions = FLAG_CATEGORIES.map(function(c, i){
      return '<option value="' + i + '">' + escapeHtml(c.label) + '</option>';
    }).join('');

    overlay.innerHTML =
      '<div class="panel modal panel-relative" style="width:470px;">'+
        '<button class="close-x">&times;</button>'+
        '<h2>&#9873; Report an issue</h2>'+
        (entry
          ? '<div class="report-context"><span class="rc-ref">'+escapeHtml(entry.refId||'')+'</span><br>'+escapeHtml(entry.title)+'</div>'
          : '<div class="report-context general">General report — not tied to a specific entry. To report a problem with one particular entry, open it and use the flag button at the bottom of its detail panel.</div>')+
        '<div class="field"><label>What kind of issue?</label><select id="rp_cat">'+catOptions+'</select></div>'+
        '<div class="field"><label>Details</label>'+
          '<textarea id="rp_details" placeholder="What is wrong, and what should it say instead? Citations or links to supporting sources are especially helpful."></textarea>'+
        '</div>'+
        '<div class="field"><label>Your name (optional)</label>'+
          '<input type="text" id="rp_name" placeholder="So the report can be followed up on">'+
        '</div>'+
        '<div class="actions">'+
          '<button id="rp_send">Open email to send</button>'+
          '<button class="ghost" id="rp_copy">Copy report instead</button>'+
          '<button class="ghost" id="rp_cancel">Cancel</button>'+
        '</div>'+
        '<div class="report-note">This opens your own email program with the report filled in — nothing is sent automatically, and you can edit it first. If no email program opens, use &ldquo;Copy report instead&rdquo; and paste it wherever you like.</div>'+
      '</div>';
    document.body.appendChild(overlay);

    function collect(){
      var details = overlay.querySelector('#rp_details').value.trim();
      if(!details){
        alert('Please describe the issue before submitting.');
        overlay.querySelector('#rp_details').focus();
        return null;
      }
      var cat = FLAG_CATEGORIES[parseInt(overlay.querySelector('#rp_cat').value, 10)] || FLAG_CATEGORIES[FLAG_CATEGORIES.length - 1];
      return {
        refId: entry ? (entry.refId || '') : '',
        entryId: entry ? entry.id : '',
        entryTitle: entry ? entry.title : '',
        category: cat.label,
        categoryShort: cat.short,
        details: details,
        reporter: overlay.querySelector('#rp_name').value.trim(),
        submitted: new Date().toISOString().slice(0,10)
      };
    }

    overlay.querySelector('#rp_send').addEventListener('click', function(){
      var report = collect();
      if(!report) return;
      sendReport(report);
      overlay.remove();
    });
    overlay.querySelector('#rp_copy').addEventListener('click', function(){
      var report = collect();
      if(!report) return;
      copyToClipboard(buildReportText(report), 'Report copied — paste it into an email or message.');
      overlay.remove();
    });

    overlay.querySelector('#rp_cancel').addEventListener('click', function(){ overlay.remove(); });
    overlay.querySelector('.close-x').addEventListener('click', function(){ overlay.remove(); });
    overlay.addEventListener('click', function(ev){ if(ev.target===overlay) overlay.remove(); });
    overlay.querySelector('#rp_details').focus();
  }

  // Copies text to the clipboard with a graceful fallback for browsers/contexts
  // where the async Clipboard API isn't available.
  function copyToClipboard(text, successMessage){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try{
        document.execCommand('copy');
        alert(successMessage);
      }catch(e){
        prompt('Copy this manually:', text);
      }
      ta.remove();
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        alert(successMessage);
      }).catch(fallback);
    }else{
      fallback();
    }
  }

  function buildFocusPlainText(){
    var lines = [];
    lines.push(focusState.title ? focusState.title : 'Untitled Focus thread');
    if(focusState.notes) lines.push(focusState.notes);
    lines.push('');
    var entries = sortedFocusEntries();
    if(!entries.length){
      lines.push('(no entries pinned yet)');
    }else{
      entries.forEach(function(e){
        lines.push('• ' + dateLabel(e) + ' — ' + e.title + (e.refId ? ' ['+e.refId+']' : ''));
      });
    }
    lines.push('');
    lines.push('— from Joseph Smith MultiTimeline');
    return lines.join('\n');
  }

  // Shareable links are built on each entry's stable refId (e.g. ID-014) rather
  // than its internal id, since refIds are the durable, human-shareable handle.
  function encodeFocusPayload(){
    var payload = {
      t: focusState.title || '',
      n: focusState.notes || '',
      ids: sortedFocusEntries().map(function(e){ return e.refId; }).filter(Boolean)
    };
    var json = JSON.stringify(payload);
    var b64 = btoa(unescape(encodeURIComponent(json)));
    return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function decodeFocusPayload(str){
    try{
      var s = str.replace(/-/g,'+').replace(/_/g,'/');
      while(s.length % 4) s += '=';
      var json = decodeURIComponent(escape(atob(s)));
      return JSON.parse(json);
    }catch(err){ return null; }
  }
  function buildFocusShareUrl(){
    var base = location.origin + location.pathname;
    return base + '?focus=' + encodeFocusPayload();
  }

  // On first load, check whether this page was opened via a shared Focus link.
  function checkForSharedFocusLink(){
    var params = new URLSearchParams(location.search);
    var raw = params.get('focus');
    if(!raw) return;
    var payload = decodeFocusPayload(raw);
    if(history.replaceState) history.replaceState(null, '', location.pathname + location.hash);
    if(!payload || !Array.isArray(payload.ids) || !payload.ids.length){
      alert('That shared Focus link could not be read.');
      return;
    }
    var resolvedIds = [];
    payload.ids.forEach(function(refId){
      var match = state.entries.find(function(e){ return e.refId === refId; });
      if(match) resolvedIds.push(match.id);
    });
    var missing = payload.ids.length - resolvedIds.length;
    if(!resolvedIds.length){
      alert('This shared Focus link doesn\'t match any entries in your current data.');
      return;
    }
    var msg = 'This link contains a shared Focus thread'+(payload.t ? ': "'+payload.t+'"' : '')+
      ' with '+resolvedIds.length+' entr'+(resolvedIds.length===1?'y':'ies')+
      (missing ? ' ('+missing+' not found in your current data)' : '')+
      '.\n\nLoad it into your Focus panel? This will replace your current Focus selection.';
    if(confirm(msg)){
      focusState.title = payload.t || '';
      focusState.notes = payload.n || '';
      focusState.ids = resolvedIds;
      focusState.open = true;
      saveFocusState();
      applyFocusOpenState();
      render();
    }
  }

  // Login is now handled entirely by the separate admin CMS (see the
  // "Log in" link in the footer) -- there is no admin mode on this page at
  // all anymore, so there's nothing to lock or unlock here.

  document.getElementById('focusToggleBtn').addEventListener('click', function(){
    focusState.open = !focusState.open;
    saveFocusState();
    applyFocusOpenState();
  });
  applyFocusOpenState();

  var THREAD_ICON_SVG = '<svg class="thread-icon-svg" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title xmlns="">thread-roll-filled</title><path fill="#8c2e22" d="M6 12.59L11.59 7H6zm12-1.18L12.41 17H18zM18 7h-3.59L6 15.41V17h3.59L18 8.59z"/><rect width="16" height="3" x="4" y="2" fill="#8c2e22" rx=".75" ry=".75"/><rect width="16" height="3" x="4" y="19" fill="#8c2e22" rx=".75" ry=".75"/></svg>';

  function updateThreadToggleUI(){
    var btn = document.getElementById('threadToggleBtn');
    btn.classList.toggle('on', uiState.threadOn);
    btn.innerHTML = THREAD_ICON_SVG + (uiState.threadOn ? ' Thread: On' : ' Thread: Off');
  }
  document.getElementById('threadToggleBtn').addEventListener('click', function(){
    uiState.threadOn = !uiState.threadOn;
    updateThreadToggleUI();
    render();
  });
  updateThreadToggleUI();

  document.getElementById('positionToggle').addEventListener('click', function(ev){
    var btn = ev.target.closest('.seg-btn');
    if(!btn) return;
    uiState.positionBy = btn.dataset.mode;
    document.querySelectorAll('#positionToggle .seg-btn').forEach(function(b){
      b.classList.toggle('on', b.dataset.mode === uiState.positionBy);
    });
    render();
  });

  /* ============================= TOOLBAR WIRING ============================= */

  document.getElementById('searchBox').addEventListener('input', function(e){
    uiState.search = e.target.value; render();
  });
  document.getElementById('personFilter').addEventListener('change', function(e){
    uiState.person = e.target.value; render();
  });
  document.getElementById('themeFilter').addEventListener('change', function(e){
    uiState.theme = e.target.value; render();
  });
  document.getElementById('zoomSlider').addEventListener('input', function(e){
    var boardWrap = document.getElementById('board-wrap');
    var bounds = minMaxYear();
    var oldPxPerYear = uiState.zoom;
    var viewportH = boardWrap.clientHeight;
    var centerPx = boardWrap.scrollTop + viewportH / 2;
    var centerFy = yToDate(centerPx, bounds, oldPxPerYear);

    uiState.zoom = sliderToZoom(parseInt(e.target.value, 10));
    updateZoomLevelLabel();
    render();

    var newCenterPx = dateToY(centerFy, bounds, uiState.zoom);
    boardWrap.scrollTop = Math.max(0, newCenterPx - viewportH / 2);
  });

  // Shows which named level the current zoom is at (or nearest, when between).
  function updateZoomLevelLabel(){
    var el = document.getElementById('zoomLevelLabel');
    if(!el) return;
    var px = uiState.zoom, best = ZOOM_SIGNPOSTS[0], bestD = Infinity;
    ZOOM_SIGNPOSTS.forEach(function(s){
      var d = Math.abs(Math.log(px) - Math.log(s.px));
      if(d < bestD){ bestD = d; best = s; }
    });
    // Only show a label for the named (non-default) levels; blank at/near default.
    el.textContent = (best.key === 'default') ? '' : best.label;
  }
  // General report — no entry passed, so the modal opens without entry context.
  document.getElementById('reportGeneralBtn').addEventListener('click', function(){ openReportModal(null); });

  window.addEventListener('resize', function(){ drawThreads(minMaxYear(), uiState.zoom); });

  // At fine zoom the rail/gridlines are generated only for the visible window
  // (see render); as the user scrolls into new territory we re-render so ticks
  // keep appearing. Debounced, and only active when zoomed past year level
  // (where the whole span is drawn anyway and no refresh is needed).
  (function(){
    var boardWrap = document.getElementById('board-wrap');
    if(!boardWrap) return;
    var lastRenderScroll = 0;
    var scrollTimer = null;
    boardWrap.addEventListener('scroll', function(){
      if(railGranularity(uiState.zoom).unit === 'year') return;
      if(scrollTimer) return;
      scrollTimer = setTimeout(function(){
        scrollTimer = null;
        var vpH = boardWrap.clientHeight;
        // Re-render after scrolling about a third of a screen. This keeps the
        // tick window fresh AND keeps the "topmost visible month carries the
        // year" label current as you scroll into a new month, without
        // re-rendering on every scroll event. Still well inside the two-screen
        // tick margin, so ticks never run out before the refresh.
        if(Math.abs(boardWrap.scrollTop - lastRenderScroll) > vpH / 3){
          lastRenderScroll = boardWrap.scrollTop;
          render();
        }
      }, 120);
    });
  })();

  // --- Zoom signposts + date-jump picker setup ---
  (function setupZoomAndJump(){
    // Signpost ticks under the slider (datalist), at each named level's slider
    // position. Labels on <option> aren't widely rendered, but the tick marks
    // give the visual signposts the user asked for.
    var dl = document.getElementById('zoomStops');
    if(dl){
      ZOOM_SIGNPOSTS.forEach(function(s){
        var opt = document.createElement('option');
        opt.value = zoomToSlider(s.px);
        if(s.label) opt.label = s.label;
        dl.appendChild(opt);
      });
    }
    // Month + day selects for the jump picker.
    var jm = document.getElementById('jumpMonth');
    if(jm){
      MONTH_ABBR.forEach(function(mn, i){
        var o = document.createElement('option'); o.value = (i+1); o.textContent = mn; jm.appendChild(o);
      });
    }
    var jd = document.getElementById('jumpDay');
    if(jd){
      for(var d=1; d<=31; d++){ var o=document.createElement('option'); o.value=d; o.textContent=d; jd.appendChild(o); }
    }
    // Bound the year field to the actual timeline span, and set its placeholder
    // to the first year so the number-spinner starts somewhere relevant (it was
    // defaulting to 1700, well before anything on this timeline). minMaxYear()
    // pads by a year on each side, so add 1 to land on the first real year.
    var jy = document.getElementById('jumpYear');
    if(jy){
      var mmy = minMaxYear();
      var firstYear = mmy.min + 1, lastYear = mmy.max - 1;
      jy.min = firstYear;
      jy.max = lastYear;
      jy.placeholder = String(firstYear);
    }
    // Reflect the current (default) zoom on the slider + label.
    var slider = document.getElementById('zoomSlider');
    if(slider) slider.value = zoomToSlider(uiState.zoom);
    updateZoomLevelLabel();
  })();

  // Centers the view on a date and zooms to the depth its precision implies:
  // year-only -> year level, +month -> month level, +day -> day level.
  function jumpToDate(y, m, d){
    if(!y) return;
    var precision = d ? 'day' : (m ? 'month' : 'year');
    uiState.zoom = zoomForPrecision(precision);
    var slider = document.getElementById('zoomSlider');
    if(slider) slider.value = zoomToSlider(uiState.zoom);
    updateZoomLevelLabel();
    render();
    var bounds = minMaxYear();
    var fy = tickFracYear(y, m || 0, d || 0);
    var boardWrap = document.getElementById('board-wrap');
    var targetPx = dateToY(fy, bounds, uiState.zoom);
    boardWrap.scrollTop = Math.max(0, targetPx - boardWrap.clientHeight / 2);
  }

  document.getElementById('jumpGo').addEventListener('click', function(){
    var y = parseInt(document.getElementById('jumpYear').value, 10);
    var m = parseInt(document.getElementById('jumpMonth').value, 10) || 0;
    var d = parseInt(document.getElementById('jumpDay').value, 10) || 0;
    if(!y){ document.getElementById('jumpYear').focus(); return; }
    jumpToDate(y, m, d);
  });
  // Enter in the year field triggers Go too.
  document.getElementById('jumpYear').addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){ ev.preventDefault(); document.getElementById('jumpGo').click(); }
  });

  render();

  // Open the board scrolled to a more eventful starting point rather than
  // the very beginning of the timeline, so first-time visitors land somewhere
  // with plenty of entries to explore right away.
  function scrollToYear(year, topOffset){
    var bounds = minMaxYear();
    var y = yFor(year, bounds, uiState.zoom);
    document.getElementById('board-wrap').scrollTop = Math.max(0, y - (topOffset || 40));
  }
  scrollToYear(1825);
  checkForSharedFocusLink();
})();
</script>
</body>
</html>
